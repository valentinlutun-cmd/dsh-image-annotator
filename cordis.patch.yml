# dsh-image-annotator bundle patch
#
# Mounts the plugin row when the package is installed into a profile
# (dsh plugin --profile <name> add dsh-image-annotator). No manual cordis.yml edits.
#
# Double-mount guard: if another enabled entry already mounts dsh-image-annotator,
# this row backs off and lets the first owner keep the row.
- insert:
    - id: dsh-image-annotator
      name: 'dsh-image-annotator'
      disabled: !!js "[...ctx.loader.entries()].some((e) => e.options.name === 'dsh-image-annotator' && e.options.id !== 'dsh-image-annotator' && !e.disabled)"
